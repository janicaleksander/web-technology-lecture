<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <title>Kategoria - edycja</title>
</head>
<body>

<div th:if="${exceptionError}" class="alert alert-danger" role="alert">
    <p th:text="${exceptionError}"></p>
</div>

<div class="container mt-5">
    <div th:replace="fragement/nav :: nav"></div>
    <h1>Szczegóły o produkcie <span th:text="${product.name}"></span></h1>
    <label for="id">ID produktu</label>
    <input type="text" id="id" th:field="*{product.id}" class="form-control" readonly>

    <label for="name">Nazwa produktu</label>
    <input type="text" id="name" th:field="*{product.name}" class="form-control" readonly>

    <label for="weight">Waga produktu [kg]</label>
    <input type="text" id="weight" th:field="*{product.weight}" class="form-control" readonly>

    <label for="price">Cena produktu [zł]</label>
    <input type="text" id="price" th:field="*{product.price}" class="form-control" readonly>

    <label for="productIdx">Indeks</label>
    <input type="text" id="productIdx" th:field="*{product.productIdx}" class="form-control" readonly>

    <label for="category">Kategoria</label>
    <input type="text" id="category" th:field="*{product.category.name}" class="form-control" readonly>
</div>
