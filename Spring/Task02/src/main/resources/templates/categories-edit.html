<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <title>Kategoria - edycja</title>
</head>
<body>

<div class="container mt-5">
    <div th:replace="fragement/nav :: nav"></div>
    <h1>Edycja kategorii: <span th:text="${category.name}"></span></h1>
    <div th:if="${exceptionError}" class="alert alert-danger" role="alert">
        <p th:text="${exceptionError}"></p>
    </div>
    <form th:action="@{/category/edit/{id}(id=${category.id})}"
          th:object="${category}" method="post">
        <div class="form-group">
            <label for="name"> Nazwa kategorii:</label>
            <input
                    type="text"
                    id="name"
                    th:field="*{name}"
                    class="form-control"
                    th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}">
                Błąd! Wprowadź poprawną wartość
            </div>
            <label for="code"> Nazwa kodu:</label>
            <input
                    type="text"
                    id="code"
                    th:field="*{code}"
                    class="form-control"
                    th:classappend="${#fields.hasErrors('code')} ? 'is-invalid' : ''">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('code')}"
                 th:errors="*{code}">
                Błąd! Wprowadź poprawną wartość
            </div>
        </div>
        <button type="submit" class="btn btn-primary"> Edytuj </button>
    </form>
</div>

</body>
</html>
