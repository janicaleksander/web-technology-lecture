<html xmlns:th="http://www.thymeleaf.org en">
<head>

        crossorigin="anonymous">

<body>

    <main>
        <div th:replace="${content}"></div>

    <footer class="py-4">
        <div th:fragment="footer" class="py-3 mt-auto bg-light text-center fixed-bottom">
            <p>&copy; Alex Rogoziński 2025</p>
