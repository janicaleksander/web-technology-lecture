<!DOCTYPE html>

<!--
********************************************************************************
@file           : product/add.html
@author         : Alex Rogoziński
@brief          : View containing a form for adding a product to the list.
********************************************************************************
-->

<html xmlns:th="http://www.thymeleaf.org en">
<head>
    <meta charset="html/text, UTF-8">
    <title>Dodawanie produktu</title>
    <link th:replace="~{fragment/layout::stylesheet}">
</head>
<body>
    <header th:replace="~{fragment/menu::menu}"></header> 

    <main>
        <div class="content d-flex flex-column align-items-center">
            <h2 class="mt-2 md-3">Dodawanie nowego produktu</h2>

            <form th:action="@{/product/add}" th:object="${product}" method="post" class="col-md-6">
                <div class="mb-3">
                    <label class="form-label">Nazwa:</label>
                    <input type="text" th:field="*{name}" class="form-control" placeholder="Wpisz nazwę produktu...">
                </div>

                <div class="mb-3">
                    <label class="form-label">Waga:</label>
                    <input type="number" th:field="*{weight}" class="form-control" step="0.01" min="0">
                </div>

                <div class="mb-3">
                    <label class="form-label">Cena:</label>
                    <input type="number" th:field="*{price}" class="form-control" step="0.01" min="0">
                </div>

                <div class="mb-3">
                    <label class="form-label">Kategoria:</label>
                    <input type="text" th:field="*{category}" class="form-control" placeholder="Wpisz kategorię produktu">
                </div>

                <button type="submit" class="btn btn-success">Dodaj</button>
                <button type="reset" class="btn btn-secondary">Wyczyść</button>
            </form>
        </div>
    </main>

    <footer>
        <div th:replace="~{fragment/layout::footer}">
            <p>&copy; Alex Rogoziński 2025</p>
        </div>
    </footer> 
</body>
</html>
