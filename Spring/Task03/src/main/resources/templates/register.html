<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">
    <title>Rejestracja</title>
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Rejestracja</h2>
                        
                        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
                        
                        <form th:action="@{/register}" method="post" th:object="${user}">
                            <div class="form-group">
                                <label for="username">Nazwa użytkownika:</label>
                                <input type="text" id="username" th:field="*{username}" 
                                       class="form-control" minlength="3" maxlength="50" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                            </div>
                            
                            <div class="form-group">
                                <label for="password">Hasło:</label>
                                <input type="password" id="password" th:field="*{password}" 
                                       class="form-control" minlength="6" maxlength="255" required>
                                <small class="form-text text-muted">Minimum 6 znaków</small>
                                <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                            </div>
                            
                            <button type="submit" class="btn btn-success btn-block">Zarejestruj się</button>
                        </form>
                        
                        <div class="text-center mt-3">
                            <p>Masz już konto? <a th:href="@{/login}">Zaloguj się tutaj</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
