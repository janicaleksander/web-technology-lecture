<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">
    <title>Sklep - przeglądaj produkty</title>
</head>
<body class="container mt-4">
<div th:replace="~{fragment/nav :: nav}"></div>

<div th:if="${success}" class="alert alert-success" role="alert">
    <p th:text="${success}"></p>
</div>
<div th:if="${error}" class="alert alert-danger" role="alert">
    <p th:text="${error}"></p>
</div>

<h1>Dostępne produkty</h1>
<p class="text-muted">Przeglądaj i dodawaj produkty do koszyka</p>

<div class="row">
    <div class="col-md-4 mb-4" th:each="product : ${products}">
        <div class="card h-100">
            <div class="card-body">
                <h5 class="card-title" th:text="${product.name}">Nazwa produktu</h5>
                <p class="card-text">
                    <strong>Cena:</strong> <span th:text="${product.price}">0.00</span> zł<br/>
                    <strong>Waga:</strong> <span th:text="${product.weight}">0.00</span> kg<br/>
                    <strong>Kategoria:</strong> <span th:text="${product.category.name}">Kategoria</span><br/>
                    <strong>Indeks:</strong> <span th:text="${product.productIdx}">Indeks</span>
                </p>
            </div>
            <div class="card-footer">
                <form th:action="@{/shop/add-to-cart/{id}(id=${product.id})}" method="post" class="form-inline">
                    <div class="form-group mr-2">
                        <label for="quantity" class="mr-2">Ilość:</label>
                        <input type="number" id="quantity" name="quantity" value="1" min="1" max="99" 
                               class="form-control form-control-sm" style="width: 70px;">
                    </div>
                    <button type="submit" class="btn btn-sm btn-primary">Dodaj do koszyka</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:if="${#lists.isEmpty(products)}" class="alert alert-info">
    <p>Brak dostępnych produktów..</p>
</div>

</body>
</html>
