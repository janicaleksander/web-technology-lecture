<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <title>Produkt - dodaj nowy</title>
</head>
<div th:replace="~{fragment/nav :: nav}"></div>
<div class="container mt-5">
<h1>Dodaj nowy produkt</h1>

<div th:if="${exceptionError}" class="alert alert-danger" role="alert">
    <p th:text="${exceptionError}"></p>
</div>

<form th:action="@{/product/new}" th:object="${product}" method="post">
    <div class="form-group">
        <label for="name">Nazwa produktu</label>
        <input
                type="text"
                id="name"
                th:field="*{name}"
                class="form-control"
                th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
        >
        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}"
             th:errors="*{name}">
            Błąd! Wprowadź poprawną wartość
        </div>

    </div>

    <div class="form-group">
        <label for="weight">Waga produktu [kg]</label>
        <input
                type="number"
                id="weight"
                step="any"
                th:field="*{weight}"
                class="form-control"
                th:classappend="${#fields.hasErrors('weight')} ? 'is-invalid' : ''"
                min="0"
        >
        <div class="invalid-feedback" th:if="${#fields.hasErrors('weight')}"
             th:errors="*{weight}">
            Błąd! Wprowadź poprawną wartość
        </div>


    </div>
    <div class="form-group">

        <label for="price">Cena produktu [zł]</label>
        <input
                type="number"
                id="price"
                step="any"

                th:field="*{price}"
                class="form-control"
                th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''"

                min="0"
        >
        <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}"
             th:errors="*{price}">
            Błąd! Wprowadź poprawną wartość
        </div>

    </div>
    <div class="form-group">
        <label for="productIdx">Indeks</label>
        <input
                type="number"
                id="productIdx"
                step="1"
                th:field="*{productIdx}"
                class="form-control"
                th:classappend="${#fields.hasErrors('productIdx')} ? 'is-invalid' : ''"
                min="0"
        >
        <div class="invalid-feedback" th:if="${#fields.hasErrors('productIdx')}"
             th:errors="*{productIdx}">
            Błąd! Wprowadź poprawną wartość
        </div>

    </div>
    <div class="form-group">

        <label for="category">Kategoria</label>
        <select th:field="*{category}" id="category">
            <option value="" disabled selected>----Wybierz----</option>
            <option th:each="cat:${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
        </select>
        <div class="invalid-feedback" th:if="${#fields.hasErrors('category')}"
             th:errors="*{category.name}">
            Błąd! Wprowadź poprawną wartość
        </div>

    </div>
    <button type="submit" class="btn btn-primary">Dodaj</button>
</form>
</div>
