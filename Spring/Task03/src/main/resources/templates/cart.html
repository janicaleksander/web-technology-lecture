<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">
    <title>Twój Koszyk</title>
</head>
<body class="container mt-4">
<div th:replace="~{fragment/nav :: nav}"></div>

<div th:if="${success}" class="alert alert-success" role="alert">
    <p th:text="${success}"></p>
</div>
<div th:if="${error}" class="alert alert-danger" role="alert">
    <p th:text="${error}"></p>
</div>

<h1>Twój Koszyk</h1>

<div th:if="${#lists.isEmpty(cartItems)}" class="alert alert-info">
    <p>Twój koszyk jest pusty. <a th:href="@{/shop}">Kontynuuj zakupy</a></p>
</div>

<div th:unless="${#lists.isEmpty(cartItems)}">
    <table class="table table-bordered">
        <thead class="thead-light">
        <tr>
            <th>Produkt</th>
            <th class="text-right">Cena</th>
            <th class="text-center">Ilość</th>
            <th class="text-right">Suma częściowa</th>
            <th class="text-center">Akcja</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${cartItems}">
            <td th:text="${item.productName}">Nazwa produktu</td>
            <td class="text-right" th:text="${#numbers.formatDecimal(item.price, 1, 2)} + ' zł'">0.00 zł</td>
            <td class="text-center">
                <form th:action="@{/cart/update/{productId}(productId=${item.productId})}" 
                      method="post" class="form-inline justify-content-center">
                    <input type="number" name="quantity" th:value="${item.quantity}" 
                           min="1" max="99" class="form-control form-control-sm" 
                           style="width: 70px; margin-right: 5px;">
                    <button type="submit" class="btn btn-sm btn-primary">Zatwierdź</button>
                </form>
            </td>
            <td class="text-right" th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)} + ' zł'">0.00 zł</td>
            <td class="text-center">
                <form th:action="@{/cart/remove/{productId}(productId=${item.productId})}" 
                      method="post" style="display: inline;">
                    <button type="submit" class="btn btn-sm btn-danger" 
                            onclick="return confirm('Czy na pewno chcesz usunąć ten produkt z koszyka?')">
                        Usuń
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <td colspan="3" class="text-right"><strong>Razem:</strong></td>
            <td class="text-right"><strong th:text="${#numbers.formatDecimal(total, 1, 2)} + ' zł'">0.00 zł</strong></td>
            <td></td>
        </tr>
        </tfoot>
    </table>

    <div class="mt-3">
        <a th:href="@{/shop}" class="btn btn-secondary">Kontynuuj zakupy</a>
        <form th:action="@{/cart/clear}" method="post" style="display: inline;">
            <button type="submit" class="btn btn-warning" 
                    onclick="return confirm('Czy na pewno chcesz wyczyścić cały koszyk?')">
                Wyczyść koszyk
            </button>
        </form>
    </div>
</div>

</body>
</html>
