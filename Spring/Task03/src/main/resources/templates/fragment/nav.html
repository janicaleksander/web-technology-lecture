<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="pl">
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">

        <a class="navbar-brand" th:href="@{/home}">Moje konto</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNavbar" aria-controls="mainNavbar"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/categories}">Kategorie</a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/product}">Produkty</a>
                </li>
                
                <li class="nav-item" sec:authorize="hasAnyRole('USER', 'ADMIN')">
                    <a class="nav-link" th:href="@{/shop}">Sklep</a>
                </li>
                
                <li class="nav-item" sec:authorize="hasAnyRole('USER', 'ADMIN')">
                    <a class="nav-link" th:href="@{/cart}">Koszyk</a>
                </li>

            </ul>
            
            <ul class="navbar-nav ml-auto">
                <li class="nav-item d-flex align-items-center">
                    <span class="navbar-text text-light mr-3">Zalogowano jako: <span sec:authentication="name"></span></span>
                </li>
                <li class="nav-item d-flex align-items-center">
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-sm btn-outline-light">Wyloguj</button>
                    </form>
                </li>
            </ul>
        </div>

    </div>
</nav>
</body>
</html>
