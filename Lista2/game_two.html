<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Guess the Number Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="assets/scripts/games.js" defer></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        .form { max-width: 320px; margin: auto; text-align: center; }
        input, button { margin: 5px; padding: 8px; }
        p { font-weight: bold; }
    </style>
</head>
<body>
<div class="form">
    <h2>Guess a Number 1–N</h2>
    <label for="randomNumberAttemptsInputBox">Set N (max attempts):</label><br>
    <input type="number" id="randomNumberAttemptsInputBox" placeholder="Enter N">
    <button id="setNumberOfAttempts" onclick="setRange()">Set</button>
    <p id="setNumberOfAttemptsError">...</p>

    <p id="randomNumberNumOfGuessesLeft">0 left</p>
    <input type="text" id="randomNumberInputBox" placeholder="Enter your guess">
    <button id="randomNumberGuessButton" onclick="gameGuessRandomNumber()">Guess!</button>
    <button id="randomNumberResetButton" onclick="resetGuessRandomNumberGame()">Reset</button>
    <p id="randomNumberResult">...</p>
</div>
</body>
</html>
