<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Guess the Month Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="assets/scripts/games.js" defer></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        .form { max-width: 300px; margin: auto; text-align: center; }
        input, button { margin: 5px; padding: 8px; }
        p { font-weight: bold; }
    </style>
</head>
<body>
<div class="form">
    <h2>Guess the Random Month!</h2>
    <p id="monthNumOfGuessesLeft">5 left</p>
    <input type="text" id="monthInputBox" placeholder="Enter month name">
    <button id="monthGuessButton" onclick="gameGuessRandomMonth()">Guess!</button>
    <button id="monthResetButton" onclick="resetGuessRandomNumberMonth()">Reset</button>
    <p id="monthResult">...</p>
</div>
</body>
</html>
